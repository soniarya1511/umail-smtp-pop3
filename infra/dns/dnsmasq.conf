# Authoritative records for the private mail network (see docker-compose.yml
# for the matching container IPs). Anything else is forwarded upstream.
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
log-queries
log-facility=-

# host-record creates the A record *and* the PTR record, both are needed:
# servers check A(name) == peer IP and PTR(peer IP) == name.
host-record=mail.posthawk.com,172.28.0.10
host-record=pop.posthawk.com,172.28.0.11
host-record=mail.swiftmail.com,172.28.0.20
host-record=pop.swiftmail.com,172.28.0.21
host-record=umail.mua.com,172.28.0.30

# MX: where to deliver mail for each domain (SMTP).
mx-host=posthawk.com,mail.posthawk.com,10
mx-host=swiftmail.com,mail.swiftmail.com,10

# SRV (RFC 6186): where a mail client finds the POP3 service of each domain.
srv-host=_pop3._tcp.posthawk.com,pop.posthawk.com,995,0,10
srv-host=_pop3._tcp.swiftmail.com,pop.swiftmail.com,995,0,10
